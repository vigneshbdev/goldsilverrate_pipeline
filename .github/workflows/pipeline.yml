name: Gold Rate Daily Post

on:
  schedule:
    - cron: "15 4 * * 1-6"   # 9:45 AM IST
    - cron: "15 10 * * 1-6"  # 3:45 PM IST
  workflow_dispatch:

jobs:
  run-gold-rate-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
