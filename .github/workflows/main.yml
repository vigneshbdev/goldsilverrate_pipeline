name: Cron Test Pipeline

on:
  schedule:
    - cron: "*/5 * * * *"

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Test scheduled trigger
        run: |
          echo "=============================="
          echo "CRON TRIGGERED"
          echo "Event: ${{ github.event_name }}"
          echo "UTC time:"
          date -u
          echo "=============================="
